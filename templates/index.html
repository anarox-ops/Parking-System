<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ParkEase — Smart Parking</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0f;
  --surface:#13131a;
  --card:#1a1a24;
  --border:#2a2a38;
  --accent:#f0c040;
  --accent2:#e07020;
  --text:#f0f0f0;
  --muted:#888;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}

/* ── Background image ── */
.bg-photo{position:fixed;inset:0;background:url('/static/parking_bg.png') center/cover no-repeat;filter:brightness(0.35);pointer-events:none;z-index:0;}

/* ── Floating blurred car silhouettes ── */
.car-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.car-float{position:absolute;opacity:0.13;filter:blur(3px);animation:carDrift linear infinite;}
.car-float:nth-child(1){width:320px;bottom:12%;left:-8%;animation-duration:28s;animation-delay:0s;}
.car-float:nth-child(2){width:220px;bottom:28%;left:15%;animation-duration:36s;animation-delay:-10s;transform:scaleX(-1);}
.car-float:nth-child(3){width:280px;bottom:5%;right:-5%;animation-duration:32s;animation-delay:-6s;transform:scaleX(-1);}
.car-float:nth-child(4){width:180px;top:18%;right:10%;animation-duration:40s;animation-delay:-20s;}
.car-float:nth-child(5){width:250px;top:8%;left:5%;animation-duration:34s;animation-delay:-14s;}
@keyframes carDrift{
  0%{transform:translateX(0) scaleX(var(--sx,1));}
  50%{transform:translateX(40px) scaleX(var(--sx,1));}
  100%{transform:translateX(0) scaleX(var(--sx,1));}
}

.bg-grid{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:0.15;pointer-events:none;z-index:0;}
.glow{position:fixed;width:700px;height:700px;background:radial-gradient(circle,rgba(240,192,64,0.10) 0%,transparent 70%);top:-120px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;width:100%;max-width:440px;padding:1.5rem;}
.logo{text-align:center;margin-bottom:2.5rem;}
.logo-icon{width:52px;height:52px;background:var(--accent);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:0.75rem;}
.logo-icon svg{width:28px;height:28px;}
h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);}
h1 span{color:var(--accent);}
.tagline{font-size:0.9rem;color:var(--muted);margin-top:4px;}

.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:1.5rem;}
.tab{flex:1;padding:0.6rem;text-align:center;font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:600;border-radius:9px;cursor:pointer;color:var(--muted);transition:all 0.2s;}
.tab.active{background:var(--accent);color:#0a0a0f;}

.form-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.75rem;}
.form-section{display:none;}
.form-section.active{display:block;}
.field{margin-bottom:1.1rem;}
label{display:block;font-size:0.8rem;font-weight:500;color:var(--muted);margin-bottom:6px;letter-spacing:0.04em;text-transform:uppercase;}
input[type=text],input[type=password]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.75rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border 0.2s;}
input:focus{border-color:var(--accent);}
.role-select{display:flex;gap:10px;margin-top:4px;}
.role-opt{flex:1;padding:0.65rem;border:1px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-family:'Syne',sans-serif;font-size:0.82rem;font-weight:600;color:var(--muted);transition:all 0.2s;background:var(--surface);}
.role-opt.selected{border-color:var(--accent);color:var(--accent);background:rgba(240,192,64,0.08);}
.role-input{display:none;}
.submit-btn{width:100%;padding:0.85rem;background:var(--accent);color:#0a0a0f;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;border:none;border-radius:10px;cursor:pointer;margin-top:0.5rem;transition:opacity 0.2s;}
.submit-btn:hover{opacity:0.88;}
.error{background:rgba(220,60,60,0.15);border:1px solid rgba(220,60,60,0.3);color:#ff7070;border-radius:10px;padding:0.75rem 1rem;font-size:0.88rem;margin-bottom:1rem;}
</style>
</head>
<body>
<div class="bg-photo"></div>
<div class="bg-grid"></div>
<div class="glow"></div>

<!-- Floating blurred car silhouettes -->
<div class="car-layer">
  <!-- Car SVG 1 -->
  <svg class="car-float" viewBox="0 0 200 80" fill="#f0c040" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="35" width="160" height="30" rx="8"/>
    <path d="M50 35 Q60 10 90 10 L130 10 Q155 10 165 35Z" fill="#f0c040"/>
    <circle cx="55" cy="68" r="13" fill="#222"/><circle cx="55" cy="68" r="7" fill="#555"/>
    <circle cx="145" cy="68" r="13" fill="#222"/><circle cx="145" cy="68" r="7" fill="#555"/>
    <rect x="155" y="40" width="22" height="10" rx="3" fill="#ffe080" opacity="0.8"/>
  </svg>
  <!-- Car SVG 2 -->
  <svg class="car-float" viewBox="0 0 200 80" fill="#e07020" xmlns="http://www.w3.org/2000/svg">
    <rect x="15" y="38" width="170" height="28" rx="8"/>
    <path d="M45 38 Q58 12 92 12 L125 12 Q158 12 168 38Z" fill="#e07020"/>
    <circle cx="50" cy="68" r="12" fill="#222"/><circle cx="50" cy="68" r="6" fill="#555"/>
    <circle cx="150" cy="68" r="12" fill="#222"/><circle cx="150" cy="68" r="6" fill="#555"/>
    <rect x="158" y="42" width="20" height="9" rx="3" fill="#ffe080" opacity="0.7"/>
  </svg>
  <!-- Car SVG 3 -->
  <svg class="car-float" viewBox="0 0 200 80" fill="#aaa" xmlns="http://www.w3.org/2000/svg">
    <rect x="18" y="36" width="164" height="30" rx="9"/>
    <path d="M48 36 Q62 11 94 11 L128 11 Q158 11 166 36Z" fill="#aaa"/>
    <circle cx="53" cy="68" r="13" fill="#222"/><circle cx="53" cy="68" r="7" fill="#555"/>
    <circle cx="147" cy="68" r="13" fill="#222"/><circle cx="147" cy="68" r="7" fill="#555"/>
    <rect x="156" y="40" width="22" height="10" rx="3" fill="#ffe080" opacity="0.75"/>
  </svg>
  <!-- Car SVG 4 (small) -->
  <svg class="car-float" viewBox="0 0 200 80" fill="#6080ff" xmlns="http://www.w3.org/2000/svg">
    <rect x="22" y="37" width="156" height="28" rx="8"/>
    <path d="M52 37 Q64 13 96 13 L126 13 Q154 13 162 37Z" fill="#6080ff"/>
    <circle cx="57" cy="67" r="12" fill="#222"/><circle cx="57" cy="67" r="6" fill="#555"/>
    <circle cx="143" cy="67" r="12" fill="#222"/><circle cx="143" cy="67" r="6" fill="#555"/>
    <rect x="154" y="41" width="20" height="9" rx="3" fill="#ffe080" opacity="0.7"/>
  </svg>
  <!-- Car SVG 5 -->
  <svg class="car-float" viewBox="0 0 200 80" fill="#50d0a0" xmlns="http://www.w3.org/2000/svg">
    <rect x="16" y="36" width="168" height="30" rx="8"/>
    <path d="M46 36 Q60 10 94 10 L130 10 Q160 10 168 36Z" fill="#50d0a0"/>
    <circle cx="51" cy="68" r="13" fill="#222"/><circle cx="51" cy="68" r="7" fill="#555"/>
    <circle cx="149" cy="68" r="13" fill="#222"/><circle cx="149" cy="68" r="7" fill="#555"/>
    <rect x="157" y="40" width="22" height="10" rx="3" fill="#ffe080" opacity="0.75"/>
  </svg>
</div>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M8 12h4a2 2 0 000-4H8v8"/>
      </svg>
    </div>
    <h1>Park<span>Ease</span></h1>
    <p class="tagline">Smart parking for everyone</p>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Login</div>
    <div class="tab" onclick="switchTab('register')">Register</div>
  </div>

  <div class="form-card">
    <div class="form-section active" id="login-section">
      <form action="/login" method="POST">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" placeholder="Enter your username" required/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="Enter your password" required/>
        </div>
        <button class="submit-btn" type="submit">Sign In</button>
      </form>
    </div>

    <div class="form-section" id="register-section">
      <form action="/register" method="POST">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" placeholder="Choose a username" required/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="Create a password" required/>
        </div>
        <div class="field">
          <label>I am a</label>
          <div class="role-select">
            <div class="role-opt selected" onclick="selectRole('owner',this)">
              Parking Owner
            </div>
            <div class="role-opt" onclick="selectRole('customer',this)">
              Customer
            </div>
          </div>
          <input type="hidden" name="role" id="role-input" value="owner"/>
        </div>
        <button class="submit-btn" type="submit">Create Account</button>
      </form>
    </div>
  </div>
</div>
<script>
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===(tab==='login'?0:1)));
  document.getElementById('login-section').classList.toggle('active',tab==='login');
  document.getElementById('register-section').classList.toggle('active',tab==='register');
}
function selectRole(role,el){
  document.querySelectorAll('.role-opt').forEach(r=>r.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('role-input').value=role;
}
</script>
</body>
</html>
