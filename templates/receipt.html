<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt — Park IT</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --card: #1a1a24;
      --border: #2a2a38;
      --accent: #f0c040;
      --text: #f0f0f0;
      --muted: #888;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .receipt {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 400px;
      width: 100%;
    }

    .icon {
      width: 52px;
      height: 52px;
      background: rgba(46, 204, 113, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .icon svg {
      width: 26px;
      height: 26px;
      stroke: #2ecc71;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 2rem;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.25rem 0;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.9rem;
    }

    .row .label {
      color: var(--muted);
    }

    .row .value {
      font-weight: 500;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding-top: 1rem;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .total-row .amt {
      color: var(--accent);
    }

    .back-btn {
      display: block;
      text-align: center;
      padding: 0.8rem;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 12px;
      text-decoration: none;
      margin-top: 1.75rem;
      transition: opacity 0.2s;
    }

    .back-btn:hover {
      opacity: 0.88;
    }
  </style>
</head>

<body>
  <div class="receipt">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    </div>
    <h2>Payment Receipt</h2>
    <p class="tagline">Your slot has been released successfully.</p>

    <div class="row"><span class="label">Facility</span><span class="value">{{ facility_name }}</span></div>
    <div class="row"><span class="label">Slot number</span><span class="value">{{ booking.slot }}</span></div>
    <div class="row"><span class="label">Entry time</span><span class="value">{{ booking.entry_time.strftime('%I:%M %p')
        }}</span></div>
    <div class="row"><span class="label">Duration</span><span class="value">{{ hours }} hour(s)</span></div>

    <div class="total-row">
      <span>Total Fee</span>
      <span class="amt">Rs. {{ fee }}</span>
    </div>

    <a class="back-btn" href="/customer">Back to Dashboard</a>
  </div>
</body>

</html>
